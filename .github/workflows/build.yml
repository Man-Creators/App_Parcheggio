name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compila
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepara il file
        run: cp app/build/outputs/apk/release/app-release.apk DoveAuto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DoveAuto-apk
          path: DoveAuto.apk

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dov'è l'auto 1.0.${{ github.run_number }}
          body: |
            Scarica **DoveAuto.apk** dal telefono e aprilo per installarlo
            (la prima volta Android chiede di consentire l'installazione da questa fonte).
            Gli aggiornamenti si installano sopra la versione precedente senza perdere i parcheggi salvati.
          files: DoveAuto.apk
          make_latest: true
